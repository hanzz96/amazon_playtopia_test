name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit, golden and end-to-end tests
        run: npm test
      - name: Run start.sh through bash (Git Bash on Windows)
        shell: bash
        run: printf 'login Emma\ndeposit 100\nlogout\n' | ./start.sh
